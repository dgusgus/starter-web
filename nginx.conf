server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: cualquier ruta del router vuelve a index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Archivos con hash en el nombre: caché larga
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
